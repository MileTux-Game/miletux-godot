name: MacOS
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:

jobs:
  export_mac:
    runs-on: ubuntu-latest
    name: Export macOS
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: export_mac
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          use_preset_export_path: true
          archive_output: true
          cache: true
          presets_to_export: "macOS"
      - name: Publish Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: macos
          path: ${{steps.export.outputs.archive_directory}}
